services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avocado
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - avocado_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocado"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  avocado_data:

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Avocado</title>
  <script>try{var p=JSON.parse(localStorage.getItem('avocado.preferences')||'{}');if(p.appearance==='light'||p.appearance==='dark')document.documentElement.dataset.theme=p.appearance}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
